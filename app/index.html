<meta charset="utf-8">
<title>PT Anatomy Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Literata:opsz,wght@7..72,500;7..72,650&display=swap">
<style>
    /*
     * Layout: a dark dissection-table stage (3D body) beside a light study panel.
     * The stage stays dark in both themes so bone and colour codes read the same;
     * the panel follows the viewer's theme. On phones the stage sits on top.
     */
    :root {
        --paper: #f2f4f3;
        --paper-raised: #ffffff;
        --ink: #1b2024;
        --muted: #5b646c;
        --line: #d6dbd9;
        --accent: #a8382f;
        --accent-soft: #f3dcd8;
        --stage: #14181b;
        --stage-ink: #dfe4e6;
        --stage-muted: #8a959c;
        --stage-line: #2b3237;
        --origin: #2f78d4;
        --insertion: #df7417;
        --nerve: #c99600;
        --taut: #d23a2c;
        --slack: #c59a5c;
        --good: #2c8a52;
        --draft: #9a5a17;
        --draft-line: #e7c79f;
        --font-display: "Literata", "Iowan Old Style", Georgia, serif;
        --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

        /* Stage overlays: frosted glass over the dark dissection table. */
        --stage-glow: #232b31;
        --stage-accent: #e46a5e;
        --glass: rgba(17, 21, 24, 0.72);
        --glass-line: rgba(255, 255, 255, 0.09);
        --glass-hover: rgba(255, 255, 255, 0.07);
        --glass-on: rgba(255, 255, 255, 0.13);

        --panel-tint: #e8ecea;
        --shadow-1: 0 1px 2px rgba(20, 30, 34, 0.06), 0 1px 1px rgba(20, 30, 34, 0.04);
        --shadow-2: 0 6px 20px rgba(20, 30, 34, 0.1), 0 1px 3px rgba(20, 30, 34, 0.06);
        --shadow-stage: 0 8px 28px rgba(0, 0, 0, 0.35);

        --r-sm: 6px;
        --r-md: 10px;
        --r-lg: 14px;
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
        --fast: 160ms;
    }

    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --paper: #171b1e;
            --paper-raised: #1f2427;
            --ink: #e6eaeb;
            --muted: #9aa4aa;
            --line: #30373c;
            --accent: #e46a5e;
            --accent-soft: #3a2422;
            --origin: #5d9ff0;
            --insertion: #f39a4a;
            --nerve: #f0c440;
            --taut: #ef5a4b;
            --slack: #c59a5c;
            --good: #4fbf7d;
            --draft: #f1c08a;
            --draft-line: #6b4a2c;
            --panel-tint: #13171a;
            --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
            --shadow-2: 0 8px 24px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.3);
            color-scheme: dark;
        }
    }

    :root[data-theme="dark"] {
        --paper: #171b1e;
        --paper-raised: #1f2427;
        --ink: #e6eaeb;
        --muted: #9aa4aa;
        --line: #30373c;
        --accent: #e46a5e;
        --accent-soft: #3a2422;
        --origin: #5d9ff0;
        --insertion: #f39a4a;
        --nerve: #f0c440;
        --taut: #ef5a4b;
        --slack: #c59a5c;
        --good: #4fbf7d;
        --draft: #f1c08a;
        --draft-line: #6b4a2c;
        --panel-tint: #13171a;
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
        --shadow-2: 0 8px 24px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.3);
        color-scheme: dark;
    }

    [hidden] {
        display: none !important;
    }

    html,
    body {
        height: 100%;
    }

    body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.5;
        overflow: hidden;
    }

    button,
    input {
        font: inherit;
        color: inherit;
    }

    button {
        cursor: pointer;
    }

    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 400px;
        height: 100%;
    }

    /* ---------------------------------------------------------------- stage */

    .stage {
        position: relative;
        min-width: 0;
        min-height: 0;
        /* A soft overhead light on the table; the canvas is transparent over it. */
        background:
            radial-gradient(ellipse 65% 55% at 50% 40%, var(--stage-glow) 0%, transparent 72%),
            var(--stage);
        color: var(--stage-ink);
        overflow: hidden;
    }

    .glass {
        background: var(--glass);
        border: 1px solid var(--glass-line);
        border-radius: var(--r-md);
        box-shadow: var(--shadow-stage);
        -webkit-backdrop-filter: blur(12px) saturate(1.2);
        backdrop-filter: blur(12px) saturate(1.2);
    }

    #view {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    .stage-top {
        position: absolute;
        inset: 12px 12px auto 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        pointer-events: none;
    }

    .crumbs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
        padding: 3px;
        pointer-events: auto;
        min-width: 0;
    }

    .crumbs:empty {
        display: none;
    }

    .crumbs button {
        border: 0;
        background: transparent;
        color: var(--stage-muted);
        padding: 4px 8px;
        border-radius: var(--r-sm);
        font-size: 13px;
        transition: color var(--fast) var(--ease), background-color var(--fast) var(--ease);
    }

    .crumbs button:hover {
        color: var(--stage-ink);
        background: var(--glass-hover);
    }

    .crumbs .here {
        color: var(--stage-ink);
        font-weight: 700;
        padding: 4px 8px;
        font-size: 13px;
    }

    .crumbs .sep {
        color: var(--stage-muted);
        font-size: 12px;
    }

    .stage-pills {
        margin-left: auto;
        display: flex;
        gap: 6px;
        align-items: center;
    }

    .pill {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-radius: 999px;
        padding: 3px 9px;
        pointer-events: auto;
        white-space: nowrap;
    }

    .pill.draft {
        color: #f1c8a0;
        border: 1px solid #6b4a2c;
        background: rgba(60, 38, 20, 0.55);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
    }

    .pill.progress {
        color: var(--stage-muted);
        border: 1px solid var(--glass-line);
        background: var(--glass);
        font-family: var(--font-mono);
        letter-spacing: 0;
        text-transform: none;
    }

    .hint {
        position: absolute;
        left: 16px;
        top: 60px;
        margin: 0;
        font-size: 12px;
        color: var(--stage-muted);
        pointer-events: none;
    }

    .labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .tag {
        position: absolute;
        left: 0;
        top: 0;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 8px 3px 7px;
        border-radius: 6px;
        background: rgba(10, 13, 15, 0.82);
        border-left: 3px solid var(--c, #ccc);
        color: #eef1f2;
    }

    .tag small {
        display: block;
        font-weight: 400;
        color: #aab4ba;
        font-size: 11px;
    }

    .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--stage-muted);
        font-size: 14px;
        background:
            radial-gradient(ellipse 65% 55% at 50% 40%, var(--stage-glow) 0%, transparent 72%),
            var(--stage);
        padding-inline: 16px;
    }

    .loading > div {
        display: grid;
        justify-items: center;
        gap: 4px;
    }

    .loading strong {
        display: block;
        font-family: var(--font-display);
        color: var(--stage-ink);
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.01em;
    }

    .loading-bar {
        position: relative;
        width: 160px;
        height: 3px;
        margin-top: 12px;
        border-radius: 99px;
        background: var(--stage-line);
        overflow: hidden;
    }

    .loading-bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: var(--stage-accent);
        animation: loading-slide 1.3s var(--ease) infinite;
    }

    @keyframes loading-slide {
        from {
            transform: translateX(-100%);
        }

        to {
            transform: translateX(250%);
        }
    }

    .dock {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
    }

    .dock > * {
        pointer-events: auto;
    }

    .joints {
        width: 230px;
        max-width: 100%;
        overflow: hidden;
    }

    .joints-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 34px;
        padding: 8px 12px;
        border: 0;
        background: none;
        color: var(--stage-muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: color var(--fast) var(--ease), background-color var(--fast) var(--ease);
    }

    .joints-head:hover {
        color: var(--stage-ink);
        background: var(--glass-hover);
    }

    .joints-head::after {
        content: "";
        width: 7px;
        height: 7px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: translateY(-2px) rotate(45deg);
        transition: transform var(--fast) var(--ease);
    }

    .joints-head[aria-expanded="false"]::after {
        transform: translateY(2px) rotate(-135deg);
    }

    .joints-list {
        display: grid;
        gap: 8px;
        padding: 2px 12px 12px;
        max-height: min(46vh, 420px);
        overflow-y: auto;
        scrollbar-width: thin;
    }

    .ctl {
        display: grid;
        gap: 3px;
    }

    .ctl label {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--stage-muted);
    }

    .ctl output {
        font-family: var(--font-mono);
        color: var(--stage-ink);
        text-transform: none;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
    }

    /*
     * Joint sliders. The track fills from the neutral (0°) position to the
     * current angle, so flexion and extension read as opposite directions.
     * --lo / --hi are set by app.js.
     */
    .ctl input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 18px;
        margin: 0;
        background: transparent;
        cursor: pointer;
    }

    .ctl input[type="range"]::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 99px;
        background: linear-gradient(to right,
                var(--stage-line) var(--lo, 0%),
                var(--stage-accent) var(--lo, 0%),
                var(--stage-accent) var(--hi, 0%),
                var(--stage-line) var(--hi, 0%));
    }

    .ctl input[type="range"]::-moz-range-track {
        height: 4px;
        border-radius: 99px;
        background: linear-gradient(to right,
                var(--stage-line) var(--lo, 0%),
                var(--stage-accent) var(--lo, 0%),
                var(--stage-accent) var(--hi, 0%),
                var(--stage-line) var(--hi, 0%));
    }

    .ctl input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        margin-top: -5px;
        border-radius: 50%;
        background: var(--stage-ink);
        border: 2px solid var(--stage-accent);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        transition: transform var(--fast) var(--ease);
    }

    .ctl input[type="range"]::-moz-range-thumb {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--stage-ink);
        border: 2px solid var(--stage-accent);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .ctl input[type="range"]:hover::-webkit-slider-thumb,
    .ctl input[type="range"]:active::-webkit-slider-thumb {
        transform: scale(1.2);
    }

    .toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        padding: 3px;
        max-width: 100%;
    }

    .chipbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 30px;
        border: 0;
        background: transparent;
        color: var(--stage-muted);
        border-radius: 7px;
        padding: 5px 11px;
        font-size: 12.5px;
        white-space: nowrap;
        transition: color var(--fast) var(--ease), background-color var(--fast) var(--ease);
    }

    /* A dot in the colour of what the layer shows; lit when the layer is on. */
    .chipbtn[aria-pressed]::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 1.5px solid var(--dot, var(--stage-muted));
        flex: 0 0 auto;
    }

    .chipbtn:hover {
        color: var(--stage-ink);
        background: var(--glass-hover);
    }

    .chipbtn[aria-pressed="true"] {
        color: var(--stage-ink);
        background: var(--glass-on);
    }

    .chipbtn[aria-pressed="true"]::before {
        background: var(--dot, var(--stage-ink));
    }

    .chipbtn:active {
        transform: translateY(1px);
    }

    /* Dots match the 3D colours in app.js COLORS (muscle, ligament, origin). */
    #tg-muscles {
        --dot: #c95a4e;
    }

    #tg-ligs {
        --dot: var(--slack);
    }

    #tg-sites {
        --dot: var(--origin);
    }

    .toggles .divider {
        width: 1px;
        align-self: stretch;
        margin: 5px 3px;
        background: var(--glass-line);
    }

    /* ---------------------------------------------------------------- panel */

    .panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        border-left: 1px solid var(--line);
        background: var(--paper);
    }

    /* Tabs: a segmented control on a tinted track. */
    .tabs {
        display: flex;
        gap: 2px;
        margin: 12px 12px 0;
        padding: 3px;
        border-radius: var(--r-md);
        background: var(--panel-tint);
        overflow-x: auto;
        scrollbar-width: none;
        flex: 0 0 auto;
    }

    .tabs::-webkit-scrollbar {
        display: none;
    }

    .tab {
        flex: 1 0 auto;
        min-height: 34px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        padding: 6px 12px;
        font-size: 14px;
        white-space: nowrap;
        transition: color var(--fast) var(--ease), background-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
    }

    .tab:hover {
        color: var(--ink);
    }

    .tab[aria-selected="true"] {
        color: var(--ink);
        font-weight: 700;
        background: var(--paper-raised);
        box-shadow: var(--shadow-1);
    }

    .scope-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        font-size: 13px;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
    }

    .scope-bar:empty {
        display: none;
    }

    .scope-bar b {
        color: var(--ink);
    }

    .scope-bar button {
        margin-left: auto;
        border: 1px solid var(--line);
        background: var(--paper-raised);
        border-radius: 999px;
        padding: 3px 12px;
        font-size: 12.5px;
        transition: border-color var(--fast) var(--ease), background-color var(--fast) var(--ease);
    }

    .scope-bar button:hover {
        border-color: var(--muted);
    }

    .views {
        flex: 1 1 auto;
        overflow-y: auto;
        min-height: 0;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
    }

    .pane {
        padding-block: 18px 28px;
        padding-inline: 18px;
        display: grid;
        gap: 16px;
        align-content: start;
    }

    .eyebrow {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    h2,
    h3 {
        margin: 0;
        text-wrap: balance;
    }

    h2 {
        font-family: var(--font-display);
        font-weight: 650;
        font-size: 26px;
        line-height: 1.15;
        letter-spacing: -0.01em;
    }

    h3 {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
    }

    p {
        margin: 0;
        max-width: 62ch;
    }

    .lede {
        color: var(--muted);
    }

    .badge {
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-radius: 999px;
        padding: 2px 8px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
    }

    .badge.draft {
        color: var(--draft);
        border-color: var(--draft-line);
    }

    .badge.notes {
        color: var(--good);
        border-color: color-mix(in srgb, var(--good) 45%, transparent);
    }

    .facts {
        display: grid;
        border-top: 1px solid var(--line);
        margin: 0;
    }

    .fact {
        display: grid;
        grid-template-columns: 98px minmax(0, 1fr);
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
    }

    .fact dt {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding-top: 2px;
    }

    .fact dd {
        margin: 0;
        min-width: 0;
        display: grid;
        gap: 6px;
    }

    .key {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: 0 0 auto;
        margin-top: 3px;
        background: var(--k);
    }

    .key.ring {
        background: transparent;
        border: 2.5px solid var(--k);
    }

    .roots {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
    }

    .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    .chip {
        border: 1px solid var(--line);
        background: var(--paper-raised);
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 13px;
        text-align: left;
    }

    .chip:hover {
        border-color: var(--muted);
    }

    .chip.prime {
        border-color: var(--accent);
        background: var(--accent-soft);
    }

    .chip .play {
        color: var(--accent);
        margin-right: 4px;
    }

    .chip .pct {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--muted);
        margin-left: 6px;
    }

    .cards {
        display: grid;
        gap: 8px;
    }

    .card {
        display: grid;
        gap: 2px;
        text-align: left;
        border: 1px solid var(--line);
        background: var(--paper-raised);
        border-radius: 10px;
        padding: 11px 13px;
    }

    .card:hover {
        border-color: var(--muted);
    }

    .card .nm {
        font-weight: 700;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: baseline;
    }

    .card .ds {
        color: var(--muted);
        font-size: 13px;
    }

    .card .count {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--muted);
        font-weight: 400;
    }

    .meter {
        display: grid;
        gap: 6px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--paper-raised);
        border: 1px solid var(--line);
    }

    .meter-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
        font-size: 13px;
    }

    .meter-row strong {
        font-family: var(--font-mono);
        font-size: 15px;
        font-variant-numeric: tabular-nums;
    }

    .bar {
        height: 8px;
        border-radius: 99px;
        background: var(--line);
        overflow: hidden;
    }

    .bar i {
        display: block;
        height: 100%;
        width: var(--w, 0%);
        background: var(--c, var(--accent));
        border-radius: 99px;
        transition: width 0.12s linear;
    }

    .note {
        font-size: 13.5px;
        color: var(--muted);
        border-left: 3px solid var(--line);
        padding-left: 10px;
    }

    .actions-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .btn {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        border-radius: 8px;
        padding: 7px 13px;
        font-size: 14px;
        font-weight: 700;
    }

    .btn.ghost {
        background: transparent;
        color: var(--accent);
    }

    .term {
        border: 0;
        padding: 0;
        background: none;
        color: inherit;
        text-decoration: underline dotted;
        text-decoration-color: var(--muted);
        text-underline-offset: 3px;
        font: inherit;
    }

    .pop {
        position: fixed;
        z-index: 20;
        max-width: 300px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--paper-raised);
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        font-size: 14px;
    }

    .pop b {
        display: block;
        text-transform: capitalize;
        margin-bottom: 2px;
    }

    .listbtn {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
        width: 100%;
        text-align: left;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        padding: 11px 2px;
    }

    .listbtn[aria-current="true"] {
        font-weight: 700;
        color: var(--accent);
    }

    .switch {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
    }

    .switch input {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
    }

    .q {
        display: grid;
        gap: 12px;
        padding: 16px;
        border-radius: 12px;
        background: var(--paper-raised);
        border: 1px solid var(--line);
    }

    .q-text {
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 500;
        line-height: 1.3;
    }

    .options {
        display: grid;
        gap: 8px;
    }

    .opt {
        text-align: left;
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 8px;
        padding: 10px 12px;
    }

    .opt.right {
        border-color: var(--good);
        background: color-mix(in srgb, var(--good) 14%, transparent);
    }

    .opt.wrong {
        border-color: var(--taut);
        background: color-mix(in srgb, var(--taut) 12%, transparent);
    }

    .feedback {
        font-weight: 700;
    }

    .feedback.right {
        color: var(--good);
    }

    .feedback.wrong {
        color: var(--taut);
    }

    .boxes {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
    }

    .box {
        display: grid;
        gap: 2px;
        text-align: center;
        padding: 8px 4px;
        border-radius: 8px;
        border: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
    }

    .box strong {
        font-family: var(--font-mono);
        font-size: 18px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
    }

    .search {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--paper-raised);
        border-radius: 8px;
        padding: 9px 11px;
    }

    .gloss {
        display: grid;
        margin: 0;
    }

    .gloss div {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
    }

    .gloss dt {
        font-weight: 700;
        text-transform: capitalize;
    }

    .gloss dd {
        margin: 0;
        color: var(--muted);
    }

    .credit {
        font-size: 11.5px;
        color: var(--muted);
        padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid var(--line);
        flex: 0 0 auto;
        margin: 0;
    }

    .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 12.5px;
        color: var(--muted);
    }

    .legend span {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    /* ---------------------------------------------------------- interaction */

    .chip,
    .card,
    .opt,
    .btn,
    .listbtn,
    .search {
        transition:
            border-color var(--fast) var(--ease),
            background-color var(--fast) var(--ease),
            box-shadow var(--fast) var(--ease),
            transform var(--fast) var(--ease),
            color var(--fast) var(--ease);
    }

    .card {
        border-radius: var(--r-md);
        box-shadow: var(--shadow-1);
    }

    .card:hover {
        box-shadow: var(--shadow-2);
        transform: translateY(-1px);
    }

    .chip:hover {
        background: color-mix(in srgb, var(--paper-raised) 80%, var(--line));
    }

    .chip.prime:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
    }

    .card:active,
    .chip:active,
    .opt:active,
    .btn:active {
        transform: translateY(1px);
        box-shadow: none;
    }

    .btn {
        box-shadow: var(--shadow-1);
    }

    .btn:hover {
        background: color-mix(in srgb, var(--accent) 88%, var(--ink));
        border-color: color-mix(in srgb, var(--accent) 88%, var(--ink));
    }

    .btn.ghost:hover {
        background: var(--accent-soft);
    }

    .listbtn {
        border-radius: var(--r-sm);
        padding-inline: 8px;
    }

    .listbtn:hover {
        background: var(--panel-tint);
    }

    .q,
    .meter {
        box-shadow: var(--shadow-1);
    }

    .opt {
        background: var(--paper-raised);
        min-height: 44px;
    }

    .opt:hover:not(.right):not(.wrong) {
        border-color: var(--muted);
        background: var(--panel-tint);
    }

    .search {
        background: var(--panel-tint);
        border-color: transparent;
        border-radius: var(--r-md);
        padding: 10px 12px;
    }

    .search:focus {
        outline: none;
        background: var(--paper-raised);
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .pop {
        border-radius: var(--r-md);
        box-shadow: var(--shadow-2);
    }

    @media (max-width: 760px) {
        .app {
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: 58% 42%;
        }

        .panel {
            border-left: 0;
            border-top: 1px solid var(--line);
        }

        .credit,
        .hint {
            display: none;
        }

        h2 {
            font-size: 22px;
        }

        .stage-top {
            inset: 8px 8px auto 8px;
        }

        .dock {
            gap: 8px;
            padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
        }

        .joints {
            width: 100%;
        }

        .joints-head {
            min-height: 36px;
            padding: 6px 12px;
        }

        .joints-list {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4px 14px;
            max-height: 28vh;
            padding-bottom: 8px;
        }

        .ctl label {
            font-size: 10px;
        }

        /* One scrolling row instead of several wrapped rows over the body. */
        .toggles {
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            width: 100%;
        }

        .toggles::-webkit-scrollbar {
            display: none;
        }

        .chipbtn {
            min-height: 36px;
            padding: 4px 10px;
            font-size: 12px;
        }

        .tabs {
            margin: 8px 8px 0;
        }

        .tab {
            min-height: 36px;
            padding: 6px 10px;
        }

        .pill.progress {
            display: none;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            transition: none !important;
        }

        .loading-bar::after {
            animation: none;
            width: 100%;
            opacity: 0.6;
        }

        .card:hover,
        .card:active,
        .chip:active,
        .opt:active,
        .btn:active,
        .chipbtn:active {
            transform: none;
        }
    }
</style>

<div class="app">
    <section class="stage" id="stage" aria-label="3D model">
        <canvas id="view"></canvas>
        <div class="labels" id="labels"></div>

        <div class="stage-top">
            <nav class="crumbs glass" id="crumbs" aria-label="Location"></nav>
            <div class="stage-pills">
                <span class="pill progress" id="progress" hidden></span>
                <span class="pill draft" title="Not yet checked by a reviewer">Draft content</span>
            </div>
        </div>
        <p class="hint" id="hint">Drag to turn · pinch or scroll to zoom · tap the body to narrow your focus</p>

        <div class="dock" id="dock">
            <div class="joints glass" id="joints">
                <button class="joints-head" id="joints-head" type="button" aria-expanded="true" aria-controls="controls">Joints</button>
                <div class="joints-list" id="controls"></div>
            </div>
            <div class="toggles glass" role="toolbar" aria-label="Layers">
                <button class="chipbtn" id="tg-muscles" type="button" aria-pressed="true">Muscles</button>
                <button class="chipbtn" id="tg-ligs" type="button" aria-pressed="false">Ligaments</button>
                <button class="chipbtn" id="tg-deep" type="button" aria-pressed="false">Deep layer</button>
                <button class="chipbtn" id="tg-cords" type="button" aria-pressed="false">Lines of pull</button>
                <button class="chipbtn" id="tg-sites" type="button" aria-pressed="false">Attachments</button>
                <span class="divider" aria-hidden="true"></span>
                <button class="chipbtn" id="tg-reset" type="button">Reset pose</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div>
                <strong>PT Anatomy Atlas</strong>
                <span id="loading-text">Loading the skeleton…</span>
                <span class="loading-bar" aria-hidden="true"></span>
            </div>
        </div>
    </section>

    <aside class="panel" aria-label="Study panel">
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" id="tab-explore" aria-selected="true" type="button">Explore</button>
            <button class="tab" role="tab" id="tab-movements" aria-selected="false" type="button">Movements</button>
            <button class="tab" role="tab" id="tab-nerves" aria-selected="false" type="button">Nerves</button>
            <button class="tab" role="tab" id="tab-quiz" aria-selected="false" type="button">Quiz</button>
            <button class="tab" role="tab" id="tab-terms" aria-selected="false" type="button">Terms</button>
        </div>
        <div class="scope-bar" id="scope-bar"></div>
        <div class="views" id="views">
            <div class="pane" id="pane-explore"></div>
            <div class="pane" id="pane-movements" hidden></div>
            <div class="pane" id="pane-nerves" hidden></div>
            <div class="pane" id="pane-quiz" hidden></div>
            <div class="pane" id="pane-terms" hidden></div>
        </div>
        <p class="credit" id="credit"></p>
    </aside>
</div>

<div class="pop" id="pop" hidden></div>
