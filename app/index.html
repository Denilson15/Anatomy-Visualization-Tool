<meta charset="utf-8">
<title>Knee Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Literata:opsz,wght@7..72,500;7..72,650&display=swap">
<style>
    /*
     * Layout: a dark dissection-table stage (3D model) beside a light study panel.
     * The stage stays dark in both themes so bone and colour codes read the same;
     * the panel follows the viewer's theme. On phones the stage sits on top.
     */
    :root {
        --paper: #f2f4f3;
        --paper-raised: #ffffff;
        --ink: #1b2024;
        --muted: #5b646c;
        --line: #d6dbd9;
        --accent: #a8382f;
        --accent-soft: #f3dcd8;
        --stage: #14181b;
        --stage-ink: #dfe4e6;
        --stage-muted: #8a959c;
        --stage-line: #2b3237;
        --origin: #2f78d4;
        --insertion: #df7417;
        --nerve: #c99600;
        --taut: #d23a2c;
        --slack: #a39f96;
        --good: #2c8a52;
        --font-display: "Literata", "Iowan Old Style", Georgia, serif;
        --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --paper: #171b1e;
            --paper-raised: #1f2427;
            --ink: #e6eaeb;
            --muted: #9aa4aa;
            --line: #30373c;
            --accent: #e46a5e;
            --accent-soft: #3a2422;
            --origin: #5d9ff0;
            --insertion: #f39a4a;
            --nerve: #f0c440;
            --taut: #ef5a4b;
            --slack: #8d8a83;
            --good: #4fbf7d;
            color-scheme: dark;
        }
    }

    :root[data-theme="dark"] {
        --paper: #171b1e;
        --paper-raised: #1f2427;
        --ink: #e6eaeb;
        --muted: #9aa4aa;
        --line: #30373c;
        --accent: #e46a5e;
        --accent-soft: #3a2422;
        --origin: #5d9ff0;
        --insertion: #f39a4a;
        --nerve: #f0c440;
        --taut: #ef5a4b;
        --slack: #8d8a83;
        --good: #4fbf7d;
        color-scheme: dark;
    }

    [hidden] {
        display: none !important;
    }

    html,
    body {
        height: 100%;
    }

    body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.5;
        overflow: hidden;
    }

    button,
    input {
        font: inherit;
        color: inherit;
    }

    button {
        cursor: pointer;
    }

    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 400px;
        height: 100%;
    }

    /* ---------------------------------------------------------------- stage */

    .stage {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: var(--stage);
        color: var(--stage-ink);
        overflow: hidden;
    }

    #view {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    .stage-top {
        position: absolute;
        inset: 12px 12px auto 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        pointer-events: none;
    }

    .crumbs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
        pointer-events: auto;
        min-width: 0;
    }

    .crumbs button {
        border: 0;
        background: transparent;
        color: var(--stage-muted);
        padding: 4px 6px;
        border-radius: 6px;
        font-size: 13px;
    }

    .crumbs button:hover {
        color: var(--stage-ink);
        background: var(--stage-line);
    }

    .crumbs .here {
        color: var(--stage-ink);
        font-weight: 700;
        padding: 4px 6px;
        font-size: 13px;
    }

    .crumbs .sep {
        color: var(--stage-muted);
        font-size: 12px;
    }

    .draft-pill {
        margin-left: auto;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #f1c8a0;
        border: 1px solid #6b4a2c;
        border-radius: 999px;
        padding: 3px 9px;
        pointer-events: auto;
    }

    .hint {
        position: absolute;
        left: 12px;
        top: 52px;
        font-size: 12px;
        color: var(--stage-muted);
        pointer-events: none;
    }

    .labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .tag {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 8px 3px 7px;
        border-radius: 6px;
        background: rgba(10, 13, 15, 0.82);
        border-left: 3px solid var(--c, #ccc);
        color: #eef1f2;
    }

    .tag small {
        display: block;
        font-weight: 400;
        color: #aab4ba;
        font-size: 11px;
    }

    .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--stage-muted);
        font-size: 14px;
        background: var(--stage);
    }

    .loading strong {
        display: block;
        font-family: var(--font-display);
        color: var(--stage-ink);
        font-size: 20px;
        font-weight: 500;
        margin-bottom: 6px;
    }

    .dock {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        gap: 14px;
        align-items: flex-end;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(to top, rgba(14, 17, 19, 0.96), rgba(14, 17, 19, 0.75) 70%, rgba(14, 17, 19, 0));
        overflow-x: auto;
        scrollbar-width: thin;
    }

    .ctl {
        display: grid;
        gap: 2px;
        min-width: 132px;
        flex: 0 0 auto;
    }

    .ctl label {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--stage-muted);
    }

    .ctl output {
        font-family: var(--font-mono);
        color: var(--stage-ink);
        text-transform: none;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
    }

    .ctl input[type="range"] {
        width: 100%;
        accent-color: #e46a5e;
    }

    .toggles {
        display: flex;
        gap: 6px;
        flex: 0 0 auto;
        padding-bottom: 2px;
    }

    .chipbtn {
        border: 1px solid var(--stage-line);
        background: #1b2125;
        color: var(--stage-muted);
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 12px;
        white-space: nowrap;
    }

    .chipbtn[aria-pressed="true"] {
        color: var(--stage-ink);
        border-color: #6d7a82;
        background: #283037;
    }

    /* ---------------------------------------------------------------- panel */

    .panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        border-left: 1px solid var(--line);
        background: var(--paper);
    }

    .tabs {
        display: flex;
        gap: 2px;
        padding: 10px 12px 0;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        flex: 0 0 auto;
    }

    .tab {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 8px 10px 9px;
        font-size: 14px;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
    }

    .tab[aria-selected="true"] {
        color: var(--ink);
        font-weight: 700;
        border-bottom-color: var(--accent);
    }

    .views {
        flex: 1 1 auto;
        overflow-y: auto;
        min-height: 0;
    }

    .pane {
        padding-block: 18px 28px;
        padding-inline: 18px;
        display: grid;
        gap: 16px;
        align-content: start;
    }

    .eyebrow {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    h1,
    h2,
    h3 {
        margin: 0;
        text-wrap: balance;
    }

    h2 {
        font-family: var(--font-display);
        font-weight: 650;
        font-size: 26px;
        line-height: 1.15;
        letter-spacing: -0.01em;
    }

    h3 {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
    }

    p {
        margin: 0;
        max-width: 62ch;
    }

    .lede {
        color: var(--muted);
    }

    .badge {
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-radius: 999px;
        padding: 2px 8px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
    }

    .badge.draft {
        color: #9a5a17;
        border-color: #e7c79f;
        background: color-mix(in srgb, #e7c79f 25%, transparent);
    }

    .facts {
        display: grid;
        gap: 0;
        border-top: 1px solid var(--line);
    }

    .fact {
        display: grid;
        grid-template-columns: 98px minmax(0, 1fr);
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
    }

    .fact dt {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding-top: 2px;
    }

    .fact dd {
        margin: 0;
        min-width: 0;
    }

    .key {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: 0 0 auto;
        margin-top: 3px;
        background: var(--k);
    }

    .key.ring {
        background: transparent;
        border: 2.5px solid var(--k);
    }

    .roots {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
    }

    .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    .chip {
        border: 1px solid var(--line);
        background: var(--paper-raised);
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 13px;
        text-align: left;
    }

    .chip:hover {
        border-color: var(--muted);
    }

    .chip.prime {
        border-color: var(--accent);
        background: var(--accent-soft);
    }

    .chip .play {
        color: var(--accent);
        margin-right: 4px;
    }

    .cards {
        display: grid;
        gap: 8px;
    }

    .card {
        display: grid;
        gap: 2px;
        text-align: left;
        border: 1px solid var(--line);
        background: var(--paper-raised);
        border-radius: 10px;
        padding: 11px 13px;
    }

    .card:hover:not(:disabled) {
        border-color: var(--muted);
    }

    .card .nm {
        font-weight: 700;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: baseline;
    }

    .card .ds {
        color: var(--muted);
        font-size: 13px;
    }

    .card:disabled {
        cursor: default;
        opacity: 0.6;
        background: transparent;
    }

    .meter {
        display: grid;
        gap: 6px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--paper-raised);
        border: 1px solid var(--line);
    }

    .meter-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
        font-size: 13px;
    }

    .meter-row strong {
        font-family: var(--font-mono);
        font-size: 15px;
        font-variant-numeric: tabular-nums;
    }

    .bar {
        height: 8px;
        border-radius: 99px;
        background: var(--line);
        overflow: hidden;
    }

    .bar i {
        display: block;
        height: 100%;
        width: var(--w, 0%);
        background: var(--c, var(--accent));
        border-radius: 99px;
        transition: width 0.12s linear;
    }

    .note {
        font-size: 13.5px;
        color: var(--muted);
        border-left: 3px solid var(--line);
        padding-left: 10px;
    }

    .actions-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .btn {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        border-radius: 8px;
        padding: 7px 13px;
        font-size: 14px;
        font-weight: 700;
    }

    .btn.ghost {
        background: transparent;
        color: var(--accent);
    }

    .term {
        border: 0;
        padding: 0;
        background: none;
        color: inherit;
        text-decoration: underline dotted;
        text-decoration-color: var(--muted);
        text-underline-offset: 3px;
        font: inherit;
    }

    .pop {
        position: fixed;
        z-index: 20;
        max-width: 300px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--paper-raised);
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        font-size: 14px;
    }

    .pop b {
        display: block;
        text-transform: capitalize;
        margin-bottom: 2px;
    }

    .listbtn {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
        width: 100%;
        text-align: left;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        padding: 11px 2px;
    }

    .listbtn[aria-current="true"] {
        font-weight: 700;
        color: var(--accent);
    }

    .listbtn.child {
        padding-left: 18px;
    }

    .switch {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
    }

    .switch input {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
    }

    .q {
        display: grid;
        gap: 12px;
        padding: 16px;
        border-radius: 12px;
        background: var(--paper-raised);
        border: 1px solid var(--line);
    }

    .q-text {
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 500;
        line-height: 1.3;
    }

    .options {
        display: grid;
        gap: 8px;
    }

    .opt {
        text-align: left;
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 8px;
        padding: 10px 12px;
    }

    .opt.right {
        border-color: var(--good);
        background: color-mix(in srgb, var(--good) 14%, transparent);
    }

    .opt.wrong {
        border-color: var(--taut);
        background: color-mix(in srgb, var(--taut) 12%, transparent);
    }

    .feedback {
        font-weight: 700;
    }

    .feedback.right {
        color: var(--good);
    }

    .feedback.wrong {
        color: var(--taut);
    }

    .boxes {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
    }

    .box {
        display: grid;
        gap: 2px;
        text-align: center;
        padding: 8px 4px;
        border-radius: 8px;
        border: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
    }

    .box strong {
        font-family: var(--font-mono);
        font-size: 18px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
    }

    .search {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--paper-raised);
        border-radius: 8px;
        padding: 9px 11px;
    }

    .gloss {
        display: grid;
        gap: 0;
    }

    .gloss div {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
    }

    .gloss dt {
        font-weight: 700;
        text-transform: capitalize;
    }

    .gloss dd {
        margin: 0;
        color: var(--muted);
    }

    .credit {
        font-size: 11.5px;
        color: var(--muted);
        padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid var(--line);
        flex: 0 0 auto;
    }

    .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 12.5px;
        color: var(--muted);
    }

    .legend span {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    @media (max-width: 760px) {
        body {
            overflow: hidden;
        }

        .app {
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: 54% 46%;
        }

        .panel {
            border-left: 0;
            border-top: 1px solid var(--line);
        }

        .credit {
            display: none;
        }

        .hint {
            display: none;
        }

        h2 {
            font-size: 22px;
        }

        .ctl {
            min-width: 118px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .bar i {
            transition: none;
        }
    }
</style>

<div class="app">
    <section class="stage" id="stage" aria-label="3D model">
        <canvas id="view"></canvas>
        <div class="labels" id="labels"></div>

        <div class="stage-top">
            <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
            <span class="draft-pill" title="Not yet checked by a reviewer">Draft content</span>
        </div>
        <p class="hint">Drag to turn · pinch or scroll to zoom · tap a structure to open it</p>

        <div class="dock" id="dock">
            <div class="ctl">
                <label for="ctl-knee">Knee flexion <output id="out-knee">0°</output></label>
                <input id="ctl-knee" type="range" min="0" max="120" value="0" step="1">
            </div>
            <div class="ctl">
                <label for="ctl-hipFlex">Hip flexion <output id="out-hipFlex">0°</output></label>
                <input id="ctl-hipFlex" type="range" min="-20" max="100" value="0" step="1">
            </div>
            <div class="ctl">
                <label for="ctl-hipAbd">Hip abduction <output id="out-hipAbd">0°</output></label>
                <input id="ctl-hipAbd" type="range" min="-15" max="40" value="0" step="1">
            </div>
            <div class="ctl">
                <label for="ctl-spread">Peel layers <output id="out-spread">0</output></label>
                <input id="ctl-spread" type="range" min="0" max="100" value="0" step="1">
            </div>
            <div class="toggles">
                <button class="chipbtn" id="tg-muscles" type="button" aria-pressed="true">Muscles</button>
                <button class="chipbtn" id="tg-cords" type="button" aria-pressed="false">Lines of pull</button>
                <button class="chipbtn" id="tg-sites" type="button" aria-pressed="false">Attachments</button>
                <button class="chipbtn" id="tg-reset" type="button">Reset pose</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div>
                <strong>Knee Atlas</strong>
                <span id="loading-text">Loading the 3D models…</span>
            </div>
        </div>
    </section>

    <aside class="panel" aria-label="Study panel">
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" id="tab-explore" aria-selected="true" type="button">Explore</button>
            <button class="tab" role="tab" id="tab-nerves" aria-selected="false" type="button">Nerves</button>
            <button class="tab" role="tab" id="tab-movements" aria-selected="false" type="button">Movements</button>
            <button class="tab" role="tab" id="tab-quiz" aria-selected="false" type="button">Quiz</button>
            <button class="tab" role="tab" id="tab-terms" aria-selected="false" type="button">Terms</button>
        </div>
        <div class="views" id="views">
            <div class="pane" id="pane-explore"></div>
            <div class="pane" id="pane-nerves" hidden></div>
            <div class="pane" id="pane-movements" hidden></div>
            <div class="pane" id="pane-quiz" hidden></div>
            <div class="pane" id="pane-terms" hidden></div>
        </div>
        <p class="credit" id="credit"></p>
    </aside>
</div>

<div class="pop" id="pop" hidden></div>

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
    }
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ==========================================================================
 * Constants
 * ======================================================================== */

const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;

const COLORS = {
    bone: 0xe6dfd2,
    boneContext: 0xb9b3a8,
    muscle: 0xb34a3f,
    tendon: 0xd9cdbd,
    ligament: 0xcfc8bb,
    meniscus: 0xa8c4cf,
    origin: 0x3a86e0,
    insertion: 0xf08a2a,
    neutralSite: 0x8e9aa2,
    nerve: 0xf2c230,
    prime: 0xd8483a,
    assist: 0xe99a8c,
    lost: 0x5d6368,
    selected: 0xd8483a,
    slack: 0xbfb8aa,
    amber: 0xf0a43a,
    taut: 0xe23c2d,
    correct: 0x3cbf74,
};

const CONTROL_LIMITS = {
    knee: [0, 120],
    hipFlex: [-20, 100],
    hipAbd: [-15, 40],
};

/* ==========================================================================
 * State
 * ======================================================================== */

const state = {
    data: null,
    geo: null,
    pose: { knee: 0, hipFlex: 0, hipAbd: 0 },
    signs: { knee: 1, hipFlex: 1, hipAbd: 1 },
    spread: 0,
    show: { muscles: true, cords: false, sites: false },
    tab: "explore",
    node: "thigh-knee",
    selection: null,
    nerve: { id: null, injury: false },
    movement: null,
    quiz: null,
    dirty: true,
    animation: null,
};

/* ==========================================================================
 * Small helpers
 * ======================================================================== */

const $ = (selector) => document.querySelector(selector);

const escapeHtml = (value) =>
    String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

function decodeBase64(text) {
    const binary = atob(text);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    return bytes.buffer;
}

function interpolate(points, x) {
    if (x <= points[0][0]) {
        return points[0][1];
    }
    for (let i = 1; i < points.length; i++) {
        const [x1, y1] = points[i];
        const [x0, y0] = points[i - 1];
        if (x <= x1) {
            return y0 + ((x - x0) / (x1 - x0)) * (y1 - y0);
        }
    }
    return points[points.length - 1][1];
}

function storageGet(key, fallback) {
    try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
    } catch (error) {
        return fallback;
    }
}

function storageSet(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
    } catch (error) {
        /* storage is optional */
    }
}

function shuffle(list) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

/* ==========================================================================
 * Scene
 * ======================================================================== */

const canvas = $("#view");
const stage = $("#stage");

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x14181b, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 1, 2000);
const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = !REDUCED_MOTION;
orbit.dampingFactor = 0.08;
orbit.minDistance = 15;
orbit.maxDistance = 400;

scene.add(new THREE.HemisphereLight(0xf4f1ea, 0x30363b, 1.15));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(80, 140, 160);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xbcd4ff, 0.7);
rimLight.position.set(-120, 60, -140);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
fillLight.position.set(-60, -40, 120);
scene.add(fillLight);

let cameraGoal = null;

function resize() {
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    if (!width || !height) {
        return;
    }
    renderer.setSize(width, height, false);
    camera.aspect = width / height;

new ResizeObserver(resize).observe(stage);

/* ==========================================================================
 * Geometry registry
 * ======================================================================== */

/** name -> { mesh, kind, segment?, base?, weights?, owner } */
const parts = {};

/** entity id -> list of mesh names it owns */
const ownedMeshes = {};

/** patch mesh name -> { site, role } */
const patchInfo = {};

/** rest-pose centroid of each patch mesh */
const patchCentroid = {};

const SEGMENT_INDEX = { pelvis: 0, femur: 1, patella: 2, tibia: 3 };
const segmentMatrices = [
    new THREE.Matrix4(),
    new THREE.Matrix4(),
    new THREE.Matrix4(),
    new THREE.Matrix4(),
];

const cordGroup = new THREE.Group();
const nerveGroup = new THREE.Group();
scene.add(cordGroup);
scene.add(nerveGroup);

function buildGeometry() {
    const { meshes } = state.geo;

    for (const [name, info] of Object.entries(meshes)) {
        const positions = new Float32Array(decodeBase64(info.positions));
        const indices = info.indexType === "u16"
            ? new Uint16Array(decodeBase64(info.indices))
            : new Uint32Array(decodeBase64(info.indices));

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions.slice(), 3));
        geometry.setIndex(new THREE.BufferAttribute(indices, 1));
        geometry.computeVertexNormals();
        geometry.computeBoundingBox();

        const material = new THREE.MeshStandardMaterial({
            color: COLORS.bone,
            roughness: 0.75,
            metalness: 0.0,
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.userData.part = name;
        mesh.matrixAutoUpdate = false;
        scene.add(mesh);

        const part = {
            name,
            mesh,
            kind: info.kind,
            base: positions,
            segment: info.segment ?? null,
            weights: info.weights ? new Uint8Array(decodeBase64(info.weights)) : null,
            owner: null,
            offsetDir: new THREE.Vector3(),
            layer: 0,
        };
        parts[name] = part;

        if (info.kind === "patch") {
            const centroid = new THREE.Vector3();
            for (let i = 0; i < positions.length; i += 3) {
                centroid.x += positions[i];
                centroid.y += positions[i + 1];
                centroid.z += positions[i + 2];
            }
            centroid.divideScalar(positions.length / 3);
            patchCentroid[name] = centroid;

            material.polygonOffset = true;
            material.polygonOffsetFactor = -2;
            material.polygonOffsetUnits = -2;
            mesh.renderOrder = 2;
        }
    }
}

function claim(entityId, meshName, ownerType) {
    const part = parts[meshName];
    if (!part) {
        return;
    }
    if (!part.owner) {
        part.owner = { type: ownerType, id: entityId };
    }
    (ownedMeshes[entityId] ||= []).push(meshName);
}

function linkEntities() {
    const { data } = state;

    for (const [id, bone] of Object.entries(data.bones)) {
        claim(id, bone.mesh, "bone");
    }

    for (const [id, muscle] of Object.entries(data.muscles)) {
        claim(id, muscle.mesh, "muscle");
        for (const extra of muscle.extraMeshes ?? []) {
            claim(id, extra, "muscle");
        }
    }

    for (const [id, ligament] of Object.entries(data.ligaments)) {
        if (ligament.mesh) {
            claim(id, ligament.mesh, "ligament");
        }
        for (const extra of ligament.extraMeshes ?? []) {
            claim(id, extra, "ligament");
        }
    }

    for (const [id, structure] of Object.entries(data.structures)) {
        claim(id, structure.mesh, "structure");
    }

    for (const [siteId, site] of Object.entries(data.sites)) {
        for (const patch of site.patches) {
            const role = patch.endsWith(".or") ? "origin" : "insertion";
            patchInfo[patch] = { site: siteId, role };
            claim(siteId, patch, "site");
        }
    }

    // Peel-away direction for each muscle: outward from the femoral shaft.
    const hip = new THREE.Vector3(...state.geo.rig.hip.pivot);
    const knee = new THREE.Vector3(...state.geo.rig.knee.pivot);
    const shaft = knee.clone().sub(hip).normalize();

    for (const [id, muscle] of Object.entries(data.muscles)) {
        for (const name of ownedMeshes[id] ?? []) {
            const part = parts[name];
            const box = part.mesh.geometry.boundingBox;
            const centre = box.getCenter(new THREE.Vector3());
            const fromHip = centre.clone().sub(hip);
            const outward = fromHip.sub(shaft.clone().multiplyScalar(fromHip.dot(shaft)));
            outward.y = 0;
            part.offsetDir.copy(outward.lengthSq() > 0.01 ? outward.normalize() : new THREE.Vector3(0, 0, 1));
            part.layer = muscle.layer ?? 0;
        }
    }
}

/* ==========================================================================
 * Rig
 * ======================================================================== */

const tmpMatrix = new THREE.Matrix4();
const rotation = new THREE.Matrix4();

function aroundPivot(pivot, axis, degrees) {
    const radians = THREE.MathUtils.degToRad(degrees);
    return new THREE.Matrix4()
        .makeTranslation(pivot.x, pivot.y, pivot.z)
        .multiply(rotation.makeRotationAxis(axis, radians))
        .multiply(tmpMatrix.makeTranslation(-pivot.x, -pivot.y, -pivot.z));
}

const rig = {
    hip: null,
    kneePivot: null,
    kneeAxis: null,
    flexAxis: null,
    abdAxis: new THREE.Vector3(0, 0, 1),
};

function setupRig() {
    const { hip, knee } = state.geo.rig;
    rig.hip = new THREE.Vector3(...hip.pivot);
    rig.kneePivot = new THREE.Vector3(...knee.pivot);
    rig.kneeAxis = new THREE.Vector3(...knee.axis).normalize();
    rig.flexAxis = new THREE.Vector3(rig.kneeAxis.x, 0, rig.kneeAxis.z).normalize();

    // Work out the rotation directions from anatomy instead of guessing.
    const ankle = new THREE.Vector3(...state.geo.rig.ankle);

    const kneeTest = ankle.clone().applyMatrix4(aroundPivot(rig.kneePivot, rig.kneeAxis, 30));
    state.signs.knee = kneeTest.z < ankle.z ? 1 : -1;

    const hipTest = rig.kneePivot.clone().applyMatrix4(aroundPivot(rig.hip, rig.flexAxis, 30));
    state.signs.hipFlex = hipTest.z > rig.kneePivot.z ? 1 : -1;

    // The right limb sits at negative x, so lateral means more negative x.
    const abdTest = rig.kneePivot.clone().applyMatrix4(aroundPivot(rig.hip, rig.abdAxis, 20));
    state.signs.hipAbd = abdTest.x < rig.kneePivot.x ? 1 : -1;
}

function computeSegmentMatrices() {
    const { pose, signs } = state;

    const hipMatrix = aroundPivot(rig.hip, rig.abdAxis, signs.hipAbd * pose.hipAbd)
        .multiply(aroundPivot(rig.hip, rig.flexAxis, signs.hipFlex * pose.hipFlex));

    const kneeMatrix = aroundPivot(rig.kneePivot, rig.kneeAxis, signs.knee * pose.knee);
    const patellaMatrix = aroundPivot(rig.kneePivot, rig.kneeAxis, signs.knee * pose.knee * 0.55);

    segmentMatrices[0].identity();
    segmentMatrices[1].copy(hipMatrix);
    segmentMatrices[2].copy(hipMatrix).multiply(patellaMatrix);
    segmentMatrices[3].copy(hipMatrix).multiply(kneeMatrix);
}

function skin(part) {
    const base = part.base;
    const weights = part.weights;
    const attribute = part.mesh.geometry.attributes.position;
    const out = attribute.array;
    const m = segmentMatrices.map((matrix) => matrix.elements);

    for (let v = 0, n = base.length / 3; v < n; v++) {
        const x = base[v * 3];
        const y = base[v * 3 + 1];
        const z = base[v * 3 + 2];
        let ox = 0;
        let oy = 0;
        let oz = 0;

        for (let s = 0; s < 4; s++) {
            const w = weights[v * 4 + s];
            if (w === 0) {
                continue;
            }
            const e = m[s];
            const k = w / 255;
            ox += k * (e[0] * x + e[4] * y + e[8] * z + e[12]);
            oy += k * (e[1] * x + e[5] * y + e[9] * z + e[13]);
            oz += k * (e[2] * x + e[6] * y + e[10] * z + e[14]);
        }

        out[v * 3] = ox;
        out[v * 3 + 1] = oy;
        out[v * 3 + 2] = oz;
    }

    attribute.needsUpdate = true;
    part.mesh.geometry.computeVertexNormals();
    part.mesh.geometry.computeBoundingSphere();
}

function skinPoint(point, weights) {
    const out = new THREE.Vector3();
    const v = new THREE.Vector3();
    for (let s = 0; s < 4; s++) {
        if (!weights[s]) {
            continue;
        }
        v.set(point[0], point[1], point[2]).applyMatrix4(segmentMatrices[s]);
        out.addScaledVector(v, weights[s] / 255);
    }
    return out;
}

function applyPose() {
    computeSegmentMatrices();

    for (const part of Object.values(parts)) {
        if (part.segment) {
            part.mesh.matrix.copy(segmentMatrices[SEGMENT_INDEX[part.segment]]);
        } else if (part.weights) {
            skin(part);
            part.mesh.matrix.identity();
        }

        if (part.kind === "muscle" && state.spread > 0) {
            const distance = state.spread * (part.layer === 0 ? 7 : 2.5);
            part.mesh.matrix.makeTranslation(
                part.offsetDir.x * distance,
                part.offsetDir.y * distance,
                part.offsetDir.z * distance,
            );
        }

        part.mesh.matrixWorldNeedsUpdate = true;
    }

    rebuildCords();
    rebuildNerves();
    updateLiveReadouts();
}

/* ==========================================================================
 * Points that follow the rig: sites, landmarks, lines of pull
 * ======================================================================== */

function sitePoint(siteId) {
    const site = state.data.sites[siteId];
    const total = new THREE.Vector3();
    let count = 0;

    for (const patch of site.patches) {
        const part = parts[patch];
        if (!part) {
            continue;
        }
        const point = patchCentroid[patch].clone().applyMatrix4(segmentMatrices[SEGMENT_INDEX[part.segment]]);
        total.add(point);
        count++;
    }

    if (count === 0 && site.landmark) {
        return landmarkPoint(site.landmark);
    }
    return total.divideScalar(Math.max(count, 1));
}

function landmarkPoint(name) {
    const landmark = state.geo.landmarks[name];
    if (!landmark) {
        return new THREE.Vector3();
    }
    return new THREE.Vector3(...landmark.point).applyMatrix4(segmentMatrices[SEGMENT_INDEX[landmark.segment]]);
}

function cordPath(muscleId) {
    const muscle = state.data.muscles[muscleId];
    const points = [sitePoint(muscle.origin[0])];

    for (const via of muscle.via ?? []) {
        points.push(sitePoint(via));
    }
    points.push(sitePoint(muscle.insertion[muscle.insertion.length - 1]));
    return points;
}

function pathLength(points) {
    let length = 0;
    for (let i = 1; i < points.length; i++) {
        length += points[i].distanceTo(points[i - 1]);
    }
    return length;
}

const restLength = {};

function muscleLengthRatio(muscleId) {
    return pathLength(cordPath(muscleId)) / restLength[muscleId];
}

function ligamentTension(ligamentId) {
    return clamp(interpolate(state.data.ligaments[ligamentId].taut, state.pose.knee), 0, 1);
}

function tensionColor(tension) {
    const slack = new THREE.Color(COLORS.slack);
    const amber = new THREE.Color(COLORS.amber);
    const taut = new THREE.Color(COLORS.taut);
    if (tension < 0.55) {
        return slack.lerp(amber, clamp((tension - 0.3) / 0.25, 0, 1));
    }
    return amber.lerp(taut, clamp((tension - 0.55) / 0.35, 0, 1));
}

function tubeAlong(points, radius) {
    const path = new THREE.CurvePath();
    for (let i = 1; i < points.length; i++) {
        path.add(new THREE.LineCurve3(points[i - 1], points[i]));
    }
    return new THREE.TubeGeometry(path, 24 * (points.length - 1), radius, 10, false);
}

function clearGroup(group) {
    for (const child of [...group.children]) {
        child.geometry?.dispose();
        child.material?.dispose();
        group.remove(child);
    }
}

function visibleCordMuscles() {
    const { data, selection } = state;
    const ids = new Set();

    if (selection?.type === "muscle") {
        ids.add(selection.id);
    }
    if (state.show.cords) {
        for (const id of muscleIdsInView()) {
            ids.add(id);
        }
    }
    if (state.tab === "movements" && state.movement) {
        // Only prime movers get a line of pull, to keep the view readable.
        for (const id of data.movements[state.movement].prime) {
            ids.add(id);
        }
    }
    return [...ids];
}

function rebuildCords() {
    clearGroup(cordGroup);
    const { data, selection } = state;

    for (const id of visibleCordMuscles()) {
        const points = cordPath(id);
        const selected = selection?.type === "muscle" && selection.id === id;
        const color = selected ? 0xff7a66 : 0xf09c8f;

        const material = new THREE.MeshStandardMaterial({
            color,
            emissive: color,
            emissiveIntensity: 0.35,
            roughness: 0.4,
            depthTest: false,
            transparent: true,
            opacity: selected ? 0.95 : 0.75,
        });
        const tube = new THREE.Mesh(tubeAlong(points, selected ? 0.32 : 0.22), material);
        tube.renderOrder = 10;
        tube.userData.cord = id;
        cordGroup.add(tube);

        // Arrowhead near the insertion, pointing back toward the origin:
        // the insertion is pulled toward the origin.
        const end = points[points.length - 1];
        const before = points[points.length - 2];
        const direction = before.clone().sub(end).normalize();
        const cone = new THREE.Mesh(
            new THREE.ConeGeometry(selected ? 0.9 : 0.65, selected ? 2.4 : 1.8, 14),
            material.clone(),
        );
        cone.position.copy(end).addScaledVector(direction, 3.2);
        cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
        cone.renderOrder = 10;
        cone.userData.cord = id;
        cordGroup.add(cone);
    }

    // Patellar ligament has no mesh in the atlas, so draw it as a band.
    const ligament = data.ligaments["patellar-ligament"];
    const [from, to] = ligament.between.map(sitePoint);
    const tension = ligamentTension("patellar-ligament");
    const band = new THREE.Mesh(
        tubeAlong([from, to], 0.75),
        new THREE.MeshStandardMaterial({ color: tensionColor(tension), roughness: 0.6 }),
    );
    band.scale.set(1, 1, 1);
    band.userData.ligament = "patellar-ligament";
    band.userData.band = true;
    cordGroup.add(band);
    applyBandAppearance(band);
}

function nerveIdsToShow() {
    const { data, selection, nerve, tab } = state;
    const ids = new Set();
    if (tab === "nerves" && nerve.id) {
        ids.add(nerve.id);
        for (const [id, item] of Object.entries(data.nerves)) {
            if (item.parent === nerve.id) {
                ids.add(id);
            }
        }
    }
    if (selection?.type === "muscle") {
        const muscleNerve = data.muscles[selection.id].nerve;
        ids.add(muscleNerve);
        const parent = data.nerves[muscleNerve].parent;
        if (parent) {
            ids.add(parent);
        }
    }
    if (selection?.type === "nerve") {
        ids.add(selection.id);
    }
    return [...ids];
}

function rebuildNerves() {
    clearGroup(nerveGroup);
    const { data } = state;

    for (const id of nerveIdsToShow()) {
        for (const curveName of data.nerves[id].curves) {
            for (const path of state.geo.nerves[curveName] ?? []) {
                const points = path.points.map((point, i) => skinPoint(point, path.weights[i]));
                if (points.length < 2) {
                    continue;
                }
                const curve = new THREE.CatmullRomCurve3(points);
                const geometry = new THREE.TubeGeometry(curve, points.length * 8, 0.42, 8, false);
                const material = new THREE.MeshStandardMaterial({
                    color: COLORS.nerve,
                    emissive: COLORS.nerve,
                    emissiveIntensity: 0.45,
                    roughness: 0.5,
                    depthTest: false,
                    transparent: true,
                    opacity: 0.9,
                });
                const tube = new THREE.Mesh(geometry, material);
                tube.renderOrder = 9;
                nerveGroup.add(tube);
            }
        }
    }
}

/* ==========================================================================
 * Appearance
 * ======================================================================== */

function muscleIdsInView() {
    const { data, node } = state;
    const ids = [];
    const visit = (id) => {
        if (data.muscles[id]) {
            ids.push(id);
            return;
        }
        for (const child of data.tree[id]?.children ?? []) {
            visit(child);
        }
    };
    visit(node);
    if (ids.length === 0) {
        return Object.keys(data.muscles);
    }
    return ids;
}

function setLook(part, look) {
    const material = part.mesh.material;
    const settings = {
        visible: true,
        color: COLORS.bone,
        opacity: 1,
        emissive: 0x000000,
        emissiveIntensity: 0,
    };

    Object.assign(settings, look);
    part.mesh.visible = settings.visible;
    material.color.setHex(settings.color);
    material.emissive.setHex(settings.emissive);
    material.emissiveIntensity = settings.emissiveIntensity;

    const transparent = settings.opacity < 0.999;
    if (material.transparent !== transparent) {
        material.transparent = transparent;
        material.needsUpdate = true;
    }
    material.opacity = settings.opacity;
    material.depthWrite = !transparent || settings.opacity > 0.5;
}

function highlightSets() {
    const { data, selection, tab, nerve, movement, quiz } = state;
    const result = {
        focus: new Set(),
        prime: new Set(),
        assist: new Set(),
        nerve: new Set(),
        lost: new Set(),
        sites: new Map(),
        dimOthers: false,
        hideMuscles: false,
    };

    if (tab === "quiz" && quiz?.current?.tap) {
        result.hideMuscles = true;
        for (const [patch, info] of Object.entries(patchInfo)) {
            result.sites.set(patch, quiz.current.revealed?.has(patch) ? "correct" : "neutral");
        }
        return result;
    }

    if (tab === "nerves" && nerve.id) {
        const nerveIds = new Set([nerve.id]);
        for (const [id, item] of Object.entries(data.nerves)) {
            if (item.parent === nerve.id) {
                nerveIds.add(id);
            }
        }
        for (const [id, muscle] of Object.entries(data.muscles)) {
            if (nerveIds.has(muscle.nerve)) {
                (nerve.injury ? result.lost : result.nerve).add(id);
            }
        }
        result.dimOthers = true;
        return result;
    }

    if (tab === "movements" && movement) {
        const item = data.movements[movement];
        item.prime.forEach((id) => result.prime.add(id));
        item.assist.forEach((id) => result.assist.add(id));
        result.dimOthers = true;
        return result;
    }

    if (!selection) {
        return result;
    }

    if (selection.type === "muscle") {
        const muscle = data.muscles[selection.id];
        result.focus.add(selection.id);
        result.dimOthers = true;
        for (const siteId of muscle.origin) {
            for (const patch of data.sites[siteId].patches) {
                result.sites.set(patch, "origin");
            }
        }
        for (const siteId of muscle.insertion) {
            for (const patch of data.sites[siteId].patches) {
                result.sites.set(patch, "insertion");
            }
        }
    } else if (selection.type === "ligament" || selection.type === "structure") {
        result.focus.add(selection.id);
        result.dimOthers = true;
        result.hideMuscles = true;
    } else if (selection.type === "site" || selection.type === "bone") {
        const siteIds = selection.type === "site"
            ? [selection.id]
            : Object.entries(data.sites)
                .filter(([, site]) => site.bone === selection.id)
                .map(([id]) => id);
        for (const siteId of siteIds) {
            for (const patch of data.sites[siteId].patches) {
                result.sites.set(patch, patchInfo[patch].role);
            }
        }
        if (selection.type === "bone") {
            result.focus.add(selection.id);
        }
        result.hideMuscles = true;
    }

    return result;
}

function applyAppearance() {
    const { data, show } = state;
    const sets = highlightSets();
    const inView = new Set(muscleIdsInView());
    const kneeGroupOpen = state.node === "knee-joint";

    for (const part of Object.values(parts)) {
        const owner = part.owner;

        if (part.kind === "bone") {
            const focused = owner && sets.focus.has(owner.id);
            setLook(part, {
                color: owner ? COLORS.bone : COLORS.boneContext,
                emissive: focused ? 0x3a3020 : 0x000000,
                emissiveIntensity: focused ? 1 : 0,
            });
            continue;
        }

        if (part.kind === "patch") {
            const role = sets.sites.get(part.name);
            const always = show.sites && !sets.hideMuscles;
            if (!role && !always) {
                setLook(part, { visible: false });
                continue;
            }
            const finalRole = role ?? patchInfo[part.name]?.role ?? "neutral";
            const color = {
                origin: COLORS.origin,
                insertion: COLORS.insertion,
                neutral: COLORS.neutralSite,
                correct: COLORS.correct,
            }[finalRole] ?? COLORS.neutralSite;
            setLook(part, { color, emissive: color, emissiveIntensity: 0.25 });
            continue;
        }

        if (part.kind === "muscle") {
            const id = owner?.id;
            const isTendon = part.name.startsWith("Calcaneal tendon");
            const baseColor = isTendon ? COLORS.tendon : COLORS.muscle;

            if (!show.muscles || sets.hideMuscles) {
                setLook(part, { visible: false });
                continue;
            }

            if (sets.focus.has(id)) {
                setLook(part, { color: baseColor, emissive: 0x401010, emissiveIntensity: 1 });
            } else if (sets.prime.has(id)) {
                setLook(part, { color: COLORS.prime, emissive: COLORS.prime, emissiveIntensity: 0.25 });
            } else if (sets.assist.has(id)) {
                setLook(part, { color: COLORS.assist, opacity: 0.85 });
            } else if (sets.nerve.has(id)) {
                setLook(part, { color: baseColor, emissive: 0x3a1408, emissiveIntensity: 1, opacity: 0.92 });
            } else if (sets.lost.has(id)) {
                setLook(part, { color: COLORS.lost, opacity: 0.9 });
            } else if (sets.dimOthers || !inView.has(id) || kneeGroupOpen) {
                setLook(part, { color: baseColor, opacity: kneeGroupOpen ? 0.06 : 0.1 });
            } else {
                setLook(part, { color: baseColor });
            }
            continue;
        }

        if (part.kind === "ligament") {
            const id = owner?.id;
            if (owner?.type === "structure") {
                const focused = sets.focus.has(id);
                setLook(part, {
                    color: COLORS.meniscus,
                    emissive: focused ? 0x204050 : 0x000000,
                    emissiveIntensity: focused ? 1 : 0,
                    opacity: sets.dimOthers && !focused ? 0.35 : 1,
                });
                continue;
            }
            const tension = id ? ligamentTension(id) : 0;
            const focused = sets.focus.has(id);
            const color = tensionColor(tension).getHex();
            setLook(part, {
                color,
                emissive: focused ? color : 0x000000,
                emissiveIntensity: focused ? 0.35 : 0,
                opacity: sets.dimOthers && !focused ? 0.3 : 1,
            });
        }
    }

    for (const child of cordGroup.children) {
        if (child.userData.band) {
            applyBandAppearance(child);
        }
    }

    renderCrumbs();
    rebuildLabels();
}

function applyBandAppearance(band) {
    const { selection } = state;
    const focused = selection?.type === "ligament" && selection.id === "patellar-ligament";
    const dim = selection && !focused && (selection.type === "ligament" || selection.type === "structure");
    band.material.transparent = Boolean(dim);
    band.material.opacity = dim ? 0.3 : 1;
    band.material.emissive.copy(focused ? band.material.color : new THREE.Color(0));
    band.material.emissiveIntensity = focused ? 0.35 : 0;
}

/* ==========================================================================
 * Labels pinned to the model
 * ======================================================================== */

const labelsEl = $("#labels");
let labels = [];

function rebuildLabels() {
    labelsEl.innerHTML = "";
    labels = [];
    const { data, selection, tab } = state;

    const add = (text, sub, color, getPoint) => {
        const el = document.createElement("div");
        el.className = "tag";
        el.style.setProperty("--c", color);
        el.innerHTML = `${escapeHtml(text)}${sub ? `<small>${escapeHtml(sub)}</small>` : ""}`;
        labelsEl.appendChild(el);
        labels.push({ el, getPoint });
    };

    if (tab !== "explore" && tab !== "terms") {
        return;
    }

    if (selection?.type === "muscle") {
        const muscle = data.muscles[selection.id];
        add(
            data.sites[muscle.origin[0]].name,
            "Origin",
            "var(--origin)",
            () => sitePoint(muscle.origin[0]),
        );
        const last = muscle.insertion[muscle.insertion.length - 1];
        add(data.sites[last].name, "Insertion", "var(--insertion)", () => sitePoint(last));
        return;
    }

    if (selection?.type === "site") {
        add(data.sites[selection.id].name, "Attachment site", "#c8d0d4", () => sitePoint(selection.id));
        return;
    }

    if (tab === "explore" && (state.node === "knee-joint" || selection?.type === "ligament")) {
        for (const [id, ligament] of Object.entries(data.ligaments)) {
            if (selection?.type === "ligament" && selection.id !== id) {
                continue;
            }
            add(
                ligament.short,
                null,
                "#" + tensionColor(ligamentTension(id)).getHexString(),
                () => ligamentAnchor(id),
            );
        }
    }
}

function ligamentAnchor(id) {
    const ligament = state.data.ligaments[id];
    if (ligament.between) {
        const [a, b] = ligament.between.map(sitePoint);
        return a.add(b).multiplyScalar(0.5);
    }
    const geometry = parts[ligament.mesh].mesh.geometry;
    geometry.computeBoundingBox();
    return geometry.boundingBox.getCenter(new THREE.Vector3());
}

function placeLabels() {
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    const placed = [];

    for (const label of labels) {
        const point = label.getPoint().project(camera);
        if (point.z > 1) {
            label.el.hidden = true;
            continue;
        }
        label.el.hidden = false;
        let x = (point.x * 0.5 + 0.5) * width + 10;
        let y = (-point.y * 0.5 + 0.5) * height - 12;

        const w = label.el.offsetWidth;
        const h = label.el.offsetHeight;
        x = clamp(x, 6, width - w - 6);
        for (const other of placed) {
            if (Math.abs(other.x - x) < w && Math.abs(other.y - y) < h + 2) {
                y = other.y + h + 4;
            }
        }
        y = clamp(y, 50, height - h - 90);
        placed.push({ x, y });
        label.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
    }
}

/* ==========================================================================
 * Camera framing
 * ======================================================================== */

function framePartsBox(names, padding = 1.25, view = null) {
    const box = new THREE.Box3();
    for (const name of names) {
        const part = parts[name];
        if (!part) {
            continue;
        }
        part.mesh.updateMatrixWorld(true);
        part.mesh.geometry.computeBoundingBox();
        box.union(part.mesh.geometry.boundingBox.clone().applyMatrix4(part.mesh.matrixWorld));
    }
    if (box.isEmpty()) {
        return;
    }

    const centre = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    // Fit the box's bounding sphere inside the narrower of the two view angles,
    // leaving room for the joint dock along the bottom of the stage.
    const radius = Math.max(size.length() / 2, 5) * padding;
    const verticalFov = THREE.MathUtils.degToRad(camera.fov);
    const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * camera.aspect);
    const distance = radius / Math.sin(Math.min(verticalFov, horizontalFov) / 2);
    centre.y -= radius * 0.08;

    const direction = view
        ? new THREE.Vector3(...view).normalize()
        : camera.position.clone().sub(orbit.target).normalize();
    if (direction.lengthSq() < 0.5) {
        direction.set(-0.45, 0.15, 1).normalize();
    }

    cameraGoal = {
        target: centre,
        position: centre.clone().addScaledVector(direction, distance),
    };

    if (REDUCED_MOTION) {
        orbit.target.copy(cameraGoal.target);
        camera.position.copy(cameraGoal.position);
        cameraGoal = null;
    }
}

function meshNamesFor(id) {
    const { data } = state;
    if (ownedMeshes[id]) {
        return ownedMeshes[id];
    }
    const names = [];
    const visit = (nodeId) => {
        if (ownedMeshes[nodeId]) {
            names.push(...ownedMeshes[nodeId]);
            return;
        }
        for (const child of data.tree[nodeId]?.children ?? []) {
            visit(child);
        }
    };
    visit(id);
    return names;
}

/* Camera directions that put each structure in front of the viewer.
 * The right limb sits at negative x, so +x is medial and -x is lateral;
 * +z is anterior. */
const VIEWS = {
    front: [-0.35, 0.12, 1],
    medial: [1, 0.12, 0.3],
    lateral: [-1, 0.12, 0.3],
    back: [-0.25, 0.12, -1],
};

const GROUP_VIEW = {
    "anterior-thigh": VIEWS.front,
    "medial-thigh": VIEWS.medial,
    "posterior-thigh": VIEWS.back,
    "posterior-knee": VIEWS.back,
    "knee-joint": VIEWS.front,
};

const LIGAMENT_VIEW = {
    acl: VIEWS.front,
    pcl: VIEWS.back,
    mcl: VIEWS.medial,
    lcl: VIEWS.lateral,
    "patellar-ligament": VIEWS.lateral,
    "medial-meniscus": [0.2, 1, 0.5],
    "lateral-meniscus": [-0.2, 1, 0.5],
};

/** Direction from the femoral shaft out to a point, used to face a site. */
function viewToward(point) {
    const out = point.clone().sub(new THREE.Vector3(rig.hip.x, point.y, rig.hip.z));
    out.y = 0;
    if (out.lengthSq() < 0.01) {
        return VIEWS.front;
    }
    out.normalize();
    return [out.x, 0.15, out.z];
}

function frameCurrent() {
    const { data, selection, node } = state;
    if (selection) {
        let names = meshNamesFor(selection.id);
        if (selection.type === "site") {
            const site = data.sites[selection.id];
            names = site.patches.length ? site.patches : [data.bones[site.bone].mesh];
            framePartsBox(names, 3.2, viewToward(sitePoint(selection.id)));
            return;
        }
        if (selection.type === "ligament" || selection.type === "structure") {
            const view = LIGAMENT_VIEW[selection.id] ?? VIEWS.front;
            if (data.ligaments[selection.id]?.between) {
                framePartsBox(["Patella.r"], 2.6, view);
                return;
            }
            framePartsBox(names, 2.6, view);
            return;
        }
        if (selection.type === "muscle") {
            framePartsBox(names, 1.2, GROUP_VIEW[data.muscles[selection.id].group]);
            return;
        }
        framePartsBox(names, 1.15, VIEWS.front);
        return;
    }
    if (node === "knee-joint") {
        framePartsBox(meshNamesFor("knee-joint"), 1.9, VIEWS.front);
        return;
    }
    if (node === "body" || node === "lower-limb") {
        framePartsBox(Object.keys(parts).filter((name) => parts[name].kind === "bone"), 1.05, VIEWS.front);
        return;
    }
    framePartsBox(meshNamesFor(node), 1.1, GROUP_VIEW[node] ?? VIEWS.front);
}

/* ==========================================================================
 * Navigation
 * ======================================================================== */

function entityType(id) {
    const { data } = state;
    if (data.tree[id]) return "node";
    if (data.muscles[id]) return "muscle";
    if (data.ligaments[id]) return "ligament";
    if (data.structures[id]) return "structure";
    if (data.bones[id]) return "bone";
    if (data.sites[id]) return "site";
    if (data.nerves[id]) return "nerve";
    return null;
}

function entityName(id) {
    const { data } = state;
    return (
        data.tree[id]?.name ??
        data.muscles[id]?.name ??
        data.ligaments[id]?.name ??
        data.structures[id]?.name ??
        data.bones[id]?.name ??
        data.sites[id]?.name ??
        data.nerves[id]?.name ??
        id
    );
}

function parentNodeOf(id) {
    const { data } = state;
    if (data.tree[id]) {
        return data.tree[id].parent ?? null;
    }
    for (const [nodeId, node] of Object.entries(data.tree)) {
        if (node.children?.includes(id)) {
            return nodeId;
        }
    }
    if (data.sites[id]) {
        return "bones";
    }
    return "thigh-knee";
}

function openEntity(id, options = {}) {
    const type = entityType(id);
    if (!type) {
        return;
    }
    hidePop();

    if (type === "node") {
        if (state.data.tree[id].comingIn) {
            return;
        }
        state.node = id;
        state.selection = null;
    } else if (type === "nerve") {
        showTab("nerves");
        selectNerve(id);
        return;
    } else {
        state.node = parentNodeOf(id);
        state.selection = { type, id };
    }

    if (options.tab !== false && state.tab !== "explore") {
        showTab("explore", { keepView: true });
    }

    state.dirty = true;
    applyAppearance();
    renderExplore();
    if (options.frame !== false) {
        frameCurrent();
    }
    $("#views").scrollTop = 0;
}

function goUp() {
    if (state.selection) {
        openEntity(state.node);
        return;
    }
    const parent = state.data.tree[state.node]?.parent;
    if (parent) {
        openEntity(parent);
    }
}

function renderCrumbs() {
    const { data, selection } = state;
    const trail = [];
    let id = state.node;
    while (id) {
        trail.unshift(id);
        id = data.tree[id]?.parent;
    }
    if (selection) {
        trail.push(selection.id);
    }

    const crumbs = $("#crumbs");
    crumbs.innerHTML = trail
        .map((item, index) => {
            const last = index === trail.length - 1;
            const name = escapeHtml(entityName(item));
            const separator = index > 0 ? '<span class="sep" aria-hidden="true">›</span>' : "";
            if (last) {
                return `${separator}<span class="here">${name}</span>`;
            }
            return `${separator}<button type="button" data-open="${escapeHtml(item)}">${name}</button>`;
        })
        .join("");
}

/* ==========================================================================
 * Text with glossary links
 * ======================================================================== */

let glossaryPattern = null;

function linkTerms(text, seen = new Set()) {
    if (!glossaryPattern) {
        const terms = Object.keys(state.data.glossary).sort((a, b) => b.length - a.length);
        glossaryPattern = new RegExp(`\\b(${terms.map((t) => t.replace(/[-]/g, "\\-")).join("|")})\\b`, "gi");
    }
    return escapeHtml(text).replace(glossaryPattern, (match) => {
        const key = match.toLowerCase();
        if (seen.has(key)) {
            return match;
        }
        seen.add(key);
        return `<button type="button" class="term" data-term="${escapeHtml(key)}">${match}</button>`;
    });
}

const pop = $("#pop");

function showTerm(term, anchor) {
    const definition = state.data.glossary[term];
    if (!definition) {
        return;
    }
    pop.innerHTML = `<b>${escapeHtml(term)}</b>${escapeHtml(definition)}`;
    pop.hidden = false;
    const rect = anchor.getBoundingClientRect();
    const width = pop.offsetWidth;
    const height = pop.offsetHeight;
    let left = clamp(rect.left, 12, innerWidth - width - 12);
    let top = rect.bottom + 8;
    if (top + height > innerHeight - 12) {
        top = rect.top - height - 8;
    }
    pop.style.left = `${left}px`;
    pop.style.top = `${top}px`;
}

function hidePop() {
    pop.hidden = true;
}

 * Explore panel

const paneExplore = $("#pane-explore");

function nerveLabel(muscle) {
    const nerve = state.data.nerves[muscle.nerve];

}

function card(id, description, extra = "") {
    const { data } = state;
    const node = data.tree[id];
    if (node?.comingIn) {
        return `
            <button class="card" type="button" disabled>
                <span class="nm">${escapeHtml(node.name)} <span class="badge">${escapeHtml(node.comingIn)}</span></span>
                <span class="ds">Planned for a later phase.</span>
            </button>`;
    }
    return `
        <button class="card" type="button" data-open="${escapeHtml(id)}">
            <span class="nm">${escapeHtml(entityName(id))} ${extra}</span>
            ${description ? `<span class="ds">${escapeHtml(description)}</span>` : ""}
        </button>`;
}

function describeChild(id) {
    const { data } = state;
    if (data.muscles[id]) {
        const muscle = data.muscles[id];
        return `${nerveLabel(muscle)} · ${muscle.roots}`;
    }
    if (data.ligaments[id]) {
        return data.ligaments[id].function;
    }
    if (data.structures[id]) {
        return "Fibrocartilage pad between femur and tibia";
    }
    if (data.bones[id]) {
        const count = Object.values(data.sites).filter((site) => site.bone === id).length;
        return count ? `${count} attachment site${count === 1 ? "" : "s"} in this region` : "";
    }
    if (data.tree[id]) {
        return data.tree[id].summary ?? "";
    }
    return "";
}

function renderNodePane(id) {
    const { data } = state;
    const node = data.tree[id];
    let html = `
        <div class="eyebrow">${id === "body" ? "Start here" : "Region"}</div>
        <h2>${escapeHtml(node.name)}</h2>`;

    if (node.summary) {
        html += `<p class="lede">${linkTerms(node.summary)}</p>`;
    }

    if (id === "body") {
        html += `<p class="lede">The lower limb is the first region built. Choose it to go one level deeper, or tap any bone or muscle on the model.</p>`;
    }

    if (id === "knee-joint") {
        html += `
            <div class="legend">
                <span><i class="key" style="--k: var(--slack)"></i>Slack</span>
                <span><i class="key" style="--k: #f0a43a"></i>Tightening</span>

        html += `

function siteMuscles(siteId) {
    const { data } = state;
    const starts = [];
    const ends = [];
    for (const [id, muscle] of Object.entries(data.muscles)) {
        if (muscle.origin.includes(siteId)) {
            starts.push(id);
        }
        if (muscle.insertion.includes(siteId)) {
            ends.push(id);
        }
    }
    const ligaments = Object.entries(data.ligaments)
        .filter(([, ligament]) => ligament.between?.includes(siteId))
        .map(([id]) => id);
    return { starts, ends, ligaments };
}

function siteBlock(siteId, withTitle) {
    const { data } = state;
    const { starts, ends, ligaments } = siteMuscles(siteId);
    const chipList = (ids) =>
        ids.map((id) => `<button class="chip" type="button" data-open="${escapeHtml(id)}">${escapeHtml(entityName(id))}</button>`).join("");

    let html = withTitle
        ? `<button class="listbtn" type="button" data-open="${escapeHtml(siteId)}"><span>${escapeHtml(data.sites[siteId].name)}</span><span aria-hidden="true">›</span></button>`
        : "";
    html += `<div class="facts">`;
    if (starts.length) {
        html += `<div class="fact"><dt><i class="key ring" style="--k: var(--origin)"></i>Starts here</dt><dd><div class="chips">${chipList(starts)}</div></dd></div>`;
    }

        html += `<div class="fact"><dt><i class="key" style="--k: var(--insertion)"></i>Ends here</dt><dd><div class="chips">${chipList(ends)}</div></dd></div>`;
    }

        html += `<div class="fact"><dt>Ligament</dt><dd><div class="chips">${chipList(ligaments)}</div></dd></div>`;

}

function renderSitePane(siteId) {

    const site = data.sites[siteId];
    return `

}

function renderBonePane(boneId) {
    const { data } = state;
    const sites = Object.entries(data.sites).filter(([, site]) => site.bone === boneId);
    let html = `
        <div class="eyebrow">Bone</div>
        <h2>${escapeHtml(data.bones[boneId].name)}</h2>`;
    if (!sites.length) {
        html += `<p class="lede">No muscle in this region attaches here yet.</p>`;
        return html;
    }
    html += `<p class="lede">Blue marks where muscles start; orange marks where they end.</p>`;
    for (const [siteId] of sites) {
        html += `<div>${siteBlock(siteId, true)}</div>`;

function renderExplore() {
    const { selection } = state;
    let html;
    if (!selection) {
        html = renderNodePane(state.node);
    } else if (selection.type === "muscle") {
        html = renderMusclePane(selection.id);
    } else if (selection.type === "ligament") {
        html = renderLigamentPane(selection.id);
    } else if (selection.type === "structure") {
        html = renderStructurePane(selection.id);
    } else if (selection.type === "site") {
        html = renderSitePane(selection.id);
    } else if (selection.type === "bone") {
        html = renderBonePane(selection.id);
    }
    paneExplore.innerHTML = html;
    updateLiveReadouts();
}

function updateLiveReadouts() {
    const { selection, pose } = state;
    if (!selection) {
        return;
    }

    if (selection.type === "muscle") {
        const value = $("#length-value");
        if (!value) {
            return;
        }
        const ratio = muscleLengthRatio(selection.id);
        const percent = Math.round(ratio * 100);
        value.textContent = `${percent}%`;
        const bar = $("#length-bar");
        bar.style.setProperty("--w", `${clamp((ratio - 0.6) / 0.8, 0, 1) * 100}%`);
        bar.style.setProperty("--c", ratio < 0.98 ? "var(--good)" : ratio > 1.02 ? "var(--taut)" : "var(--muted)");
        let text = "At resting length. Move a joint to see it shorten or stretch.";
        if (ratio < 0.98) {
            text = "Shorter than standing: this pose is in the direction the muscle pulls.";
        } else if (ratio > 1.02) {
            text = "Stretched: this pose is the opposite of what the muscle does.";
        }
        $("#length-text").textContent = text;
    }

    if (selection.type === "ligament") {
        const bar = $("#tension-bar");
        if (!bar) {
            return;
        }
        const tension = ligamentTension(selection.id);
        $("#tension-angle").textContent = `${Math.round(pose.knee)}°`;
        $("#tension-word").textContent = tension > 0.85 ? "Taut" : tension > 0.55 ? "Tightening" : "Slack";
        bar.style.setProperty("--w", `${tension * 100}%`);
        bar.style.setProperty("--c", "#" + tensionColor(tension).getHexString());
    }
}

/* ==========================================================================
 * Motion playback
 * ======================================================================== */

function setPose(control, value) {
    const [lo, hi] = CONTROL_LIMITS[control];
    state.pose[control] = clamp(value, lo, hi);
    const input = $(`#ctl-${control}`);
    input.value = Math.round(state.pose[control]);
    $(`#out-${control}`).textContent = `${Math.round(state.pose[control])}°`;
    state.dirty = true;
}

function playMotion(rigStep) {
    const { control, from, to } = rigStep;
    const legs = [
        [state.pose[control], from, 450],
        [from, to, 1300],
        [to, from, 1100],
        [from, to, 1300],
    ];

    if (REDUCED_MOTION) {
        setPose(control, to);
        return;
    }

    state.animation = { control, legs, leg: 0, start: performance.now() };
}

function stepAnimation(now) {
    const animation = state.animation;
    if (!animation) {
        return;
    }
    const [a, b, duration] = animation.legs[animation.leg];
    const t = clamp((now - animation.start) / duration, 0, 1);
    const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    setPose(animation.control, a + (b - a) * eased);

    if (t >= 1) {
        animation.leg++;
        animation.start = now;
        if (animation.leg >= animation.legs.length) {
            state.animation = null;
        }
    }
}

 * Quiz
