const paneQuiz = $("#pane-quiz");
const QUIZ_KEY = "knee-atlas-quiz-v1";

function quizItems() {
    const { data } = state;
    const items = [];
    for (const id of Object.keys(data.muscles)) {
        items.push({ key: `insertion:${id}`, kind: "tap", role: "insertion", muscle: id });
        items.push({ key: `origin:${id}`, kind: "tap", role: "origin", muscle: id });
        items.push({ key: `nerve:${id}`, kind: "nerve", muscle: id });
        items.push({ key: `action:${id}`, kind: "action", muscle: id });
    }
    for (const id of Object.keys(data.ligaments)) {
        items.push({ key: `ligament:${id}`, kind: "ligament", ligament: id });
        if (id !== "patellar-ligament") {
            items.push({ key: `taut:${id}`, kind: "taut", ligament: id });
        }
    }
    for (const id of Object.keys(data.nerves)) {
        if (!["sciatic"].includes(id)) {
            items.push({ key: `injury:${id}`, kind: "injury", nerve: id });
        }
    }
    return items;
}

function loadBoxes() {
    return storageGet(QUIZ_KEY, {});
}

function pickQuestion(focusMuscle = null) {
    const boxes = loadBoxes();
    let items = quizItems();
    if (focusMuscle) {
        items = items.filter((item) => item.muscle === focusMuscle);
    }
    const last = state.quiz?.current?.key;
    const weighted = [];
    for (const item of items) {
        if (item.key === last && items.length > 1) {
            continue;
        }
        const box = boxes[item.key] ?? 1;
        const weight = [0, 8, 5, 3, 2, 1][box] ?? 1;
        for (let i = 0; i < weight; i++) {
            weighted.push(item);
        }
    }
    const item = weighted[Math.floor(Math.random() * weighted.length)];
    return buildQuestion(item);
}

function multipleChoice(correct, pool, count = 4) {
    const wrong = shuffle(pool.filter((value) => value !== correct)).slice(0, count - 1);
    return shuffle([correct, ...wrong]);
}

function buildQuestion(item) {
    const { data } = state;
    const question = { key: item.key, item, answered: false };

    if (item.kind === "tap") {
        const muscle = data.muscles[item.muscle];
        const sites = item.role === "insertion"
            ? muscle.insertion
            : muscle.origin;
        const patches = sites.flatMap((siteId) => data.sites[siteId].patches);
        if (patches.length === 0) {
            return buildQuestion({ ...item, kind: "nerve", key: `nerve:${item.muscle}` });
        }
        question.tap = true;
        question.text = `Tap the ${item.role} of ${muscle.name} on the model.`;
        question.answerPatches = new Set(patches);
        question.revealed = new Set();
        question.explain = item.role === "insertion" ? muscle.insertionText : muscle.originText;
        return question;
    }

    if (item.kind === "nerve") {
        const muscle = data.muscles[item.muscle];
        const correct = nerveLabel(muscle);
        const pool = [
            "Femoral nerve",
            "Obturator nerve",
            "Tibial division of the sciatic nerve",
            "Common fibular division of the sciatic nerve",
            "Tibial nerve",
        ];
        question.text = `Which nerve supplies ${muscle.name}?`;
        question.options = multipleChoice(correct, pool);
        question.correct = correct;
        question.explain = `${correct}, roots ${muscle.roots}.`;
        return question;
    }

    if (item.kind === "action") {
        const muscle = data.muscles[item.muscle];
        const own = muscle.actions.map((id) => data.movements[id].name);
        const correct = own[0];
        const pool = Object.values(data.movements)
            .map((movement) => movement.name)
            .filter((name) => !own.includes(name));
        question.text = `Which of these is an action of ${muscle.name}?`;
        question.options = shuffle([correct, ...shuffle(pool).slice(0, 3)]);
        question.correct = correct;
        question.explain = `${muscle.name}: ${own.join(", ").toLowerCase()}.`;
        return question;
    }

    if (item.kind === "ligament") {
        const ligament = data.ligaments[item.ligament];
        const correct = ligament.name;
        const pool = Object.values(data.ligaments).map((other) => other.name);
        question.text = `Which ligament does this job? ${ligament.function}`;
        question.options = multipleChoice(correct, pool);
        question.correct = correct;
        question.explain = `${ligament.name}. ${ligament.tautText}`;
        return question;
    }

    if (item.kind === "taut") {
        const ligament = data.ligaments[item.ligament];
        const angle = Math.random() < 0.5 ? 0 : 90;
        const tension = interpolate(ligament.taut, angle);
        const correct = tension > 0.7 ? "Taut" : "Slack";
        question.text = `With the knee ${angle === 0 ? "fully straight" : "bent to 90°"}, is the ${ligament.short} taut or slack?`;
        question.options = ["Taut", "Slack"];
        question.correct = correct;
        question.explain = ligament.tautText;
        question.pose = angle;
        return question;
    }

    const nerve = data.nerves[item.nerve];
    const supplied = Object.values(data.muscles).filter((muscle) => muscle.nerve === item.nerve);
    if (!supplied.length) {
        return buildQuestion({ key: "nerve:rectus-femoris", kind: "nerve", muscle: "rectus-femoris" });
    }
    const correctMuscle = supplied[Math.floor(Math.random() * supplied.length)];
    const others = Object.values(data.muscles)
        .filter((muscle) => muscle.nerve !== item.nerve)
        .map((muscle) => muscle.name);
    question.text = `An injury to the ${nerve.name.toLowerCase()} would weaken which muscle?`;
    question.options = shuffle([correctMuscle.name, ...shuffle(others).slice(0, 3)]);
    question.correct = correctMuscle.name;
    question.explain = nerve.injury;
    return question;
}

function recordAnswer(key, right) {
    const boxes = loadBoxes();
    const box = boxes[key] ?? 1;
    boxes[key] = right ? Math.min(5, box + 1) : 1;
    storageSet(QUIZ_KEY, boxes);
}

function startQuiz(focusMuscle = null) {
    state.quiz = {
        focusMuscle,
        current: null,
        score: { right: 0, total: 0 },
        ...(state.quiz?.focusMuscle === focusMuscle ? { score: state.quiz.score } : {}),
    };
    nextQuestion();
}

function nextQuestion() {
    state.quiz.current = pickQuestion(state.quiz.focusMuscle);
    const current = state.quiz.current;
    state.animation = null;
    if (current.pose !== undefined || current.tap) {
        setPose("knee", 0);
        setPose("hipFlex", 0);
        setPose("hipAbd", 0);
    }
    state.selection = null;
    state.dirty = true;
    applyPose();
    applyAppearance();
    renderQuiz();
    if (current.tap) {
        const target = new THREE.Vector3();
        for (const patch of current.answerPatches) {
            target.add(patchCentroid[patch]);
        }
        target.divideScalar(current.answerPatches.size);
        framePartsBox(
            meshNamesFor("bones").filter((name) => name !== "Calcaneus.r"),
            1.0,
            viewToward(target),
        );
    }
}

function answerQuiz(choice) {
    const current = state.quiz.current;
    if (current.answered) {
        return;
    }
    current.answered = true;
    current.choice = choice;
    current.right = choice === current.correct;
    state.quiz.score.total++;
    if (current.right) {
        state.quiz.score.right++;
    }
    recordAnswer(current.key, current.right);
    renderQuiz();
}

function answerTap(patch) {
    const current = state.quiz.current;
    if (!current?.tap || current.answered) {
        return;
    }
    current.answered = true;
    current.right = current.answerPatches.has(patch);
    current.tapped = patchInfo[patch] ? state.data.sites[patchInfo[patch].site].name : null;
    current.revealed = current.answerPatches;
    state.quiz.score.total++;
    if (current.right) {
        state.quiz.score.right++;
    }
    recordAnswer(current.key, current.right);
    applyAppearance();
    renderQuiz();
}

function renderQuiz() {
    const quiz = state.quiz;
    const boxes = loadBoxes();
    const items = quizItems();
    const counts = [0, 0, 0, 0, 0];
    for (const item of items) {
        counts[(boxes[item.key] ?? 1) - 1]++;
    }

    let html = `
        <div class="eyebrow">Quiz · spaced repetition</div>
        <h2>${quiz?.focusMuscle ? escapeHtml(state.data.muscles[quiz.focusMuscle].name) : "Thigh and knee"}</h2>`;

    if (!quiz?.current) {
        html += `
            <p class="lede">Questions you miss come back sooner; ones you know fade out. Some questions ask you to tap the answer on the model.</p>
            <div class="actions-row"><button class="btn" type="button" data-quiz-start>Start the quiz</button></div>`;
    } else {
        const current = quiz.current;
        html += `<div class="q"><div class="q-text">${escapeHtml(current.text)}</div>`;

        if (current.tap) {
            if (!current.answered) {
                html += `<p class="lede">Muscles are hidden so you can see the bone. Grey patches are attachment sites.</p>`;
            }
        } else {
            html += `<div class="options">`;
            for (const option of current.options) {
                let cls = "";
                if (current.answered) {
                    if (option === current.correct) cls = " right";
                    else if (option === current.choice) cls = " wrong";
                }
                html += `<button class="opt${cls}" type="button" data-answer="${escapeHtml(option)}" ${current.answered ? "disabled" : ""}>${escapeHtml(option)}</button>`;
            }
            html += `</div>`;
        }

        if (current.answered) {
            const tappedText = current.tap && !current.right && current.tapped
                ? ` You tapped the ${current.tapped.toLowerCase()}. The answer is now shown in green.`
                : current.tap && !current.right
                    ? " The answer is now shown in green."
                    : "";
            html += `
                <p class="feedback ${current.right ? "right" : "wrong"}">${current.right ? "Correct." : "Not quite."}${escapeHtml(tappedText)}</p>
                <p>${linkTerms(current.explain)}</p>
                <div class="actions-row"><button class="btn" type="button" data-quiz-next>Next question</button></div>`;
        }
        html += `</div>`;
        html += `<p class="lede">This session: <b>${quiz.score.right}</b> of ${quiz.score.total} right.</p>`;
    }

    html += `
        <h3>Your boxes</h3>
        <div class="boxes">
            ${counts.map((count, i) => `<div class="box"><strong>${count}</strong>${i === 0 ? "New or missed" : i === 4 ? "Mastered" : `Box ${i + 1}`}</div>`).join("")}
        </div>
        <p class="lede">Progress is saved in this browser only.</p>`;

    paneQuiz.innerHTML = html;
}

const TABS = ["explore", "nerves", "movements", "quiz", "terms"];

function showTab(name, options = {}) {
    if (name !== state.tab) {
        state.animation = null;
    }
    state.tab = name;
    for (const tab of TABS) {
        $(`#tab-${tab}`).setAttribute("aria-selected", String(tab === name));

/* ==========================================================================
 * Picking on the model
 * ======================================================================== */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerDown = null;

function pickAt(event) {
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);

    const candidates = [
        ...Object.values(parts).map((part) => part.mesh).filter((mesh) => mesh.visible && (mesh.material.opacity > 0.2)),
        ...cordGroup.children,
    ];
    const hits = raycaster.intersectObjects(candidates, false);
    if (!hits.length) {
        return null;
    }

    // Prefer an attachment patch or cord if one is hit near the front.
    const front = hits[0].distance;
    const special = hits.find((hit) =>
        hit.distance < front + 1.5 &&
        (hit.object.userData.cord || parts[hit.object.userData.part]?.kind === "patch"),
    );
    return (special ?? hits[0]).object;
}

canvas.addEventListener("pointerdown", (event) => {
    pointerDown = { x: event.clientX, y: event.clientY, t: performance.now() };
});

canvas.addEventListener("pointerup", (event) => {
    if (!pointerDown) {
        return;
    }
    const moved = Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y);
    const quick = performance.now() - pointerDown.t < 600;
    pointerDown = null;
    if (moved > 6 || !quick) {
        return;
    }

    const object = pickAt(event);

    if (state.tab === "quiz" && state.quiz?.current?.tap) {
        const name = object?.userData.part;
        if (name && parts[name].kind === "patch") {
            answerTap(name);
        }
        return;
    }

    if (!object) {
        goUp();
        return;
    }

    if (object.userData.cord) {
        openEntity(object.userData.cord);
        return;
    }
    if (object.userData.ligament) {
        openEntity(object.userData.ligament);
        return;
    }

    const part = parts[object.userData.part];
    if (part?.owner) {
        openEntity(part.owner.id);
    }
});

/* ==========================================================================
 * Event wiring
 * ======================================================================== */

document.addEventListener("click", (event) => {
    const target = event.target.closest("button, input");
    if (!target) {
        if (!event.target.closest(".pop")) {
            hidePop();
        }
        return;
    }

    const data = target.dataset;

    if (data.term) {
        event.stopPropagation();
        showTerm(data.term, target);
        return;
    }
    if (data.open) {
        openEntity(data.open);
        return;
    }
    if (data.nerve) {
        showTab("nerves");
        selectNerve(data.nerve);
        return;
    }
    if (data.selectNerve) {
        selectNerve(data.selectNerve);
        return;
    }
    if (data.selectMovement) {
        selectMovement(data.selectMovement);
        return;
    }
    if (data.play) {
        const movement = state.data.movements[data.play];
        if (movement.rig) {
            playMotion(movement.rig);
        }
        return;
    }
    if (data.sweep) {
        playMotion({ control: "knee", from: 0, to: 110 });
        return;
    }
    if ("quizStart" in data) {
        startQuiz(null);
        return;
    }
    if (data.quizOn) {
        showTab("quiz");
        startQuiz(data.quizOn);
        return;
    }
    if ("quizNext" in data) {
        nextQuestion();
        return;
    }
    if (data.answer !== undefined && target.classList.contains("opt")) {
        answerQuiz(data.answer);
        return;
    }
    if (target.id === "injury-toggle") {
        state.nerve.injury = target.checked;
        state.dirty = true;
        applyAppearance();
        renderNerves();
        return;
    }
    hidePop();
});

for (const tab of TABS) {
    $(`#tab-${tab}`).addEventListener("click", () => {
        showTab(tab);
        if (tab === "quiz" && !state.quiz) {
            renderQuiz();
        }
    });
}

for (const control of Object.keys(CONTROL_LIMITS)) {
    $(`#ctl-${control}`).addEventListener("input", (event) => {
        state.animation = null;
        setPose(control, Number(event.target.value));
    });
}

$("#ctl-spread").addEventListener("input", (event) => {
    state.spread = Number(event.target.value) / 100;
    $("#out-spread").textContent = event.target.value;
    state.dirty = true;
});

function toggle(id, key) {
    $(id).addEventListener("click", (event) => {
        state.show[key] = !state.show[key];
        event.currentTarget.setAttribute("aria-pressed", String(state.show[key]));
        state.dirty = true;
        applyAppearance();
    });
}

toggle("#tg-muscles", "muscles");
toggle("#tg-cords", "cords");
toggle("#tg-sites", "sites");

$("#tg-reset").addEventListener("click", () => {
    state.animation = null;
    setPose("knee", 0);
    setPose("hipFlex", 0);
    setPose("hipAbd", 0);
    $("#ctl-spread").value = 0;
    $("#out-spread").textContent = "0";
    state.spread = 0;
    state.dirty = true;
});

document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
        if (!pop.hidden) {
            hidePop();
            return;
        }
        if (!event.target.closest?.("input")) {
            goUp();
        }
    }
});

/* ==========================================================================
 * Loop
 * ======================================================================== */

let lastFrame = performance.now();

function tick(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.1);
    lastFrame = now;
    stepAnimation(now);

    if (state.dirty) {
        state.dirty = false;
        applyPose();
        if (state.selection?.type === "ligament" || state.node === "knee-joint") {
            applyAppearance();
        } else {
            for (const part of Object.values(parts)) {
                if (part.kind === "ligament" && part.owner?.type === "ligament") {
                    const tension = ligamentTension(part.owner.id);
                    part.mesh.material.color.copy(tensionColor(tension));
                }
            }
        }
    }

    if (cameraGoal) {
        const ease = 1 - Math.exp(-dt * 7);
        camera.position.lerp(cameraGoal.position, ease);
        orbit.target.lerp(cameraGoal.target, ease);
        if (camera.position.distanceTo(cameraGoal.position) < 0.05) {
            cameraGoal = null;
        }
    }

    orbit.update();
    renderer.render(scene, camera);
    placeLabels();
    requestAnimationFrame(tick);
}

orbit.addEventListener("start", () => {
    cameraGoal = null;
});

/* ==========================================================================
 * Boot
 * ======================================================================== */

async function boot() {
    try {
        const [data, geo] = await Promise.all([
            fetch("anatomy.json").then((response) => response.json()),
            fetch("geometry.json").then((response) => response.json()),
        ]);
        state.data = data;
        state.geo = geo;
    } catch (error) {
        $("#loading-text").textContent = "The model files could not be loaded. Reload the page to try again.";
        return;
    }

    $("#credit").textContent = `${state.data.meta.modelCredit} Content is a draft awaiting review.`;

    buildGeometry();
    linkEntities();
    setupRig();
    computeSegmentMatrices();

    for (const id of Object.keys(state.data.muscles)) {
        restLength[id] = pathLength(cordPath(id));
    }

    resize();
    camera.position.set(-75, 78, 150);
    orbit.target.set(-8, 60, 0);

    applyPose();
    openEntity("thigh-knee");
    if (cameraGoal) {
        orbit.target.copy(cameraGoal.target);
        camera.position.copy(cameraGoal.position);
        cameraGoal = null;
    }

    $("#loading").hidden = true;
    requestAnimationFrame(tick);

    // Hook for automated checks; harmless for viewers.
    window.__atlas = { state, camera, orbit, setPose, openEntity };
}

boot();
</script>
